---
## AmneziaWG interface name
amneziawg_interface: "awg0"

## Config directory (awg-quick reads from here, NOT /etc/wireguard)
amneziawg_config_dir: "/etc/amnezia/amneziawg"

## Server address in CIDR notation
amneziawg_address: "10.0.0.1/24"

## Listen port
amneziawg_port: 51820

## Private key (leave empty to auto-generate)
amneziawg_private_key: ""

## DNS for clients (usually AdGuard Home on AWG IP)
amneziawg_dns: "{{ amneziawg_address | ansible.utils.ipaddr('address') }}"

## Enable IPv4 forwarding
amneziawg_ip_forward: true

## Enable IPv6 forwarding (default off — matches previous behavior)
amneziawg_ipv6_forward: false

## Linux headers meta-package — tracks future kernels so DKMS can rebuild
## the module after a kernel upgrade. Auto-selected by distro/arch below;
## override for non-generic kernels (e.g. linux-headers-virtual, -kvm, -cloud).
amneziawg_deb_arch_map:
  x86_64: amd64
  aarch64: arm64
amneziawg_headers_meta_package: >-
  {{ 'linux-headers-generic'
     if ansible_facts['distribution'] == 'Ubuntu'
     else 'linux-headers-' ~ (amneziawg_deb_arch_map[ansible_facts['architecture']] | default('amd64')) }}

## Force config deployment even if peers exist
amneziawg_force_config: false

## Update amneziawg packages to latest version from PPA
## Default: false (state: present — install only if missing)
## Set to true to upgrade: state: latest
amneziawg_update: false

## AmneziaWG Launchpad PPA signing key ID (fetched from keyserver.ubuntu.com)
amneziawg_ppa_key_id: "57290828"

## Retry/timeout for the PPA key download (keyserver.ubuntu.com is often slow).
## With force: false the key is fetched only once; these guard transient timeouts.
amneziawg_ppa_key_timeout: 30
amneziawg_ppa_key_retries: 5
amneziawg_ppa_key_delay: 10

## Optional per-release suite remap for Ubuntu releases the Amnezia PPA does not
## build for yet. Empty by default; add entries like {resolute: plucky} if needed.
## Debian always uses focal (no Launchpad builds for Debian).
amneziawg_ppa_suite_map: {}
amneziawg_ppa_suite: >-
  {{ 'focal'
     if ansible_facts['distribution'] == 'Debian'
     else amneziawg_ppa_suite_map[ansible_facts['distribution_release']]
          | default(ansible_facts['distribution_release']) }}

## Declared AmneziaWG config version: "1.0" | "1.5" | "2.0"
## The role derives the effective version from the obfuscation params below and
## fails when it does not match this value. This guards a group_vars shared by
## v1.0 hosts against an accidental v1.5/v2.0 parameter.
## Derivation mirrors amnezia-client (awgProtocolConfig.cpp, awgVersionOf):
##   2.0 — S3 > 0, or S4 > 0, or any of H1-H4 given as a range "a-b"
##   1.5 — any of I1-I5 set
##   1.0 — none of the above
amneziawg_config_version: "1.0"

## AmneziaWG obfuscation parameters
## All parameters (except Jc/Jmin/Jmax) must match between server and client
## See: https://github.com/amnezia-vpn/amneziawg-linux-kernel-module#configuration

## Jc — number of junk packets (1–128); recommended: 4–12
amneziawg_jc: 4

## Jmin — min junk packet size in bytes (< Jmax < 1280); recommended: 8
amneziawg_jmin: 8

## Jmax — max junk packet size in bytes (> Jmin, ≤ 1280); recommended: 80
amneziawg_jmax: 80

## S1 — init handshake junk size; 0 = off, else 12–150
## Constraint: S1 + 56 ≠ S2
amneziawg_s1: 30

## S2 — response handshake junk size; 0 = off, else 12–150
amneziawg_s2: 40

## H1–H4 — magic header values (must be unique, range: 5–2147483647)
## AmneziaWG 2.0 also accepts a range "a-b"; ranges must not overlap.
amneziawg_h1: 1234567891
amneziawg_h2: 1234567892
amneziawg_h3: 1234567893
amneziawg_h4: 1234567894

## --- AmneziaWG 1.5 / 2.0 parameters ---
## Defaults keep the rendered config at v1.0: 0 / "" values are not emitted at
## all, so an existing v1.0 host renders byte-for-byte the same config.
## Upper bounds mirror amnezia-client (protocolConstants.h):
##   junkPacketSizeMin = 12, initPacketJunkSizeMax = responsePacketJunkSizeMax = 150,
##   cookieReplyPacketJunkSizeMax = 64

## Interface MTU the kernel module always assigns, used only to report the
## client MTU ceiling when S4 is enabled. device.c: ETH_DATA_LEN (1500) minus
## MESSAGE_MINIMUM_LENGTH (32) + udphdr (8) + ipv6hdr (40) = 1420.
amneziawg_iface_mtu: 1420

## S3 — cookie reply junk size (2.0); 0 = off, else 12–64
## Constraint: S3 ≠ S2 + 28 (cookie reply would match the response size)
amneziawg_s3: 0

## S4 — transport (data) packet junk size (2.0); 0 = off, else 12–32
## WARNING: S4 is NOT accounted for in the interface MTU. The kernel module
## always computes dev->mtu = 1500 - 80 = 1420 (device.c), so every data packet
## grows by S4 bytes on the wire. Lower the client MTU by at least S4.
## Amnezia's own reference default is S1=S2=S3=S4=12 with MTU 1376.
amneziawg_s4: 0

## I1–I5 — CPS (Custom Protocol Signature) packets sent before the handshake
## (1.5); "" = off. Sent in order I1..I5, missing entries are skipped.
## Tags: <b 0xHEX> static bytes | <t> unix timestamp | <r N> random bytes
##       | <rc N> random ASCII letters | <rd N> random digits;  N ≤ 1000
## Do NOT reuse the default signature shipped by the Amnezia client — it is
## present in every default installation and is a fingerprint by itself.
amneziawg_i1: ""
amneziawg_i2: ""
amneziawg_i3: ""
amneziawg_i4: ""
amneziawg_i5: ""
