---
- name: amneziawg | Fail if distro is not supported
  ansible.builtin.fail:
    msg: "Distribution '{{ ansible_facts['distribution'] }}' is not supported. Supported: Debian, Ubuntu"
  when: ansible_facts['distribution'] not in ['Debian', 'Ubuntu']

- name: amneziawg | Validate obfuscation parameters
  ansible.builtin.assert:
    that:
      - "(amneziawg_s1 | int + 56) != (amneziawg_s2 | int)"
      - "amneziawg_jmin | int < amneziawg_jmax | int"
      - "amneziawg_jc | int >= 1 and amneziawg_jc | int <= 128"
      - "amneziawg_jmax | int <= 1280"
      - "[amneziawg_h1, amneziawg_h2, amneziawg_h3, amneziawg_h4] | map('int') | unique | length == 4"
    fail_msg: >-
      Invalid AmneziaWG obfuscation params
      (require S1+56 != S2, Jmin < Jmax, 1 <= Jc <= 128, Jmax <= 1280, H1-H4 unique).
    quiet: true

- name: amneziawg | Install prerequisites
  ansible.builtin.apt:
    name:
      - gnupg2
      - python3-debian                                  # required by deb822_repository
      - "linux-headers-{{ ansible_facts['kernel'] }}"   # current kernel — immediate DKMS build
      - "{{ amneziawg_headers_meta_package }}"          # meta — tracks future kernels
    state: present
    update_cache: true

- name: amneziawg | Ensure apt keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

# Remove legacy one-line repo files from the apt_key / apt_repository era
# (Debian: amnezia.list, amnezia-src.list; Ubuntu ppa: amnezia-ubuntu-ppa-*.list)
# to avoid duplicate sources alongside the new deb822 amnezia.sources file.
- name: amneziawg | Find legacy one-line repository files
  ansible.builtin.find:
    paths: /etc/apt/sources.list.d
    patterns:
      - "amnezia.list"
      - "amnezia-src.list"
      - "amnezia-ubuntu-ppa-*.list"
  register: amneziawg_legacy_repos

- name: amneziawg | Remove legacy one-line repository files
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ amneziawg_legacy_repos.files }}"
  loop_control:
    label: "{{ item.path }}"

# deb822_repository replaces the deprecated apt_key / apt_repository modules
# (removed in ansible-core 2.25). The PPA signing key is fetched as an
# ASCII-armored keyring and referenced via signed_by.
- name: amneziawg | Download AmneziaWG PPA signing key
  ansible.builtin.get_url:
    url: "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x{{ amneziawg_ppa_key_id }}&options=mr"
    dest: /etc/apt/keyrings/amnezia.asc
    owner: root
    group: root
    mode: "0644"

- name: amneziawg | Add AmneziaWG PPA repository
  ansible.builtin.deb822_repository:
    name: amnezia
    types: "{{ ['deb', 'deb-src'] if ansible_facts['distribution'] == 'Debian' else ['deb'] }}"
    uris: "https://ppa.launchpadcontent.net/amnezia/ppa/ubuntu"
    # Debian has no Launchpad builds — reuse the focal (Ubuntu 20.04) suite.
    suites: "{{ 'focal' if ansible_facts['distribution'] == 'Debian' else ansible_facts['distribution_release'] }}"
    components:
      - main
    signed_by: /etc/apt/keyrings/amnezia.asc
    enabled: true
    state: present

- name: amneziawg | Install AmneziaWG packages
  ansible.builtin.apt:
    name:
      - amneziawg
    state: "{{ 'latest' if amneziawg_update | bool else 'present' }}"
    # Required: refresh cache so the newly added Amnezia repo is visible.
    update_cache: true

- name: amneziawg | Ensure config directory exists
  ansible.builtin.file:
    path: "{{ amneziawg_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: amneziawg | Check if AmneziaWG config exists
  ansible.builtin.stat:
    path: "{{ amneziawg_config_dir }}/{{ amneziawg_interface }}.conf"
  register: awg_config_file

- name: amneziawg | Read existing config (if present)
  ansible.builtin.slurp:
    src: "{{ amneziawg_config_dir }}/{{ amneziawg_interface }}.conf"
  register: awg_config_content
  when: awg_config_file.stat.exists
  no_log: true

- name: amneziawg | Store decoded config content
  ansible.builtin.set_fact:
    amneziawg_existing_config: "{{ (awg_config_content.content | b64decode) if awg_config_file.stat.exists else '' }}"
  no_log: true

- name: amneziawg | Set peer count and existence facts
  ansible.builtin.set_fact:
    amneziawg_peers_count: "{{ amneziawg_existing_config.split('[Peer]') | length - 1 }}"
    amneziawg_peers_exist: "{{ (amneziawg_existing_config.split('[Peer]') | length - 1) > 0 }}"

- name: amneziawg | Display peers status
  ansible.builtin.debug:
    msg: "AmneziaWG config has {{ amneziawg_peers_count }} peer(s). Config will {{ 'NOT be modified' if (amneziawg_peers_exist and not amneziawg_force_config) else 'be deployed' }}."

- name: amneziawg | Warn if interface params drift but peers exist
  ansible.builtin.debug:
    msg: >-
      WARNING: [Interface] params (port/obfuscation) differ from the deployed config,
      but {{ amneziawg_peers_count }} peer(s) exist — changes were NOT applied.
      To apply: set amneziawg_force_config=true (WARNING: wipes peers) or edit
      {{ amneziawg_config_dir }}/{{ amneziawg_interface }}.conf manually.
  when:
    - amneziawg_peers_exist
    - not amneziawg_force_config
    - >-
      ('ListenPort = ' ~ amneziawg_port) not in amneziawg_existing_config
      or ('S1 = ' ~ amneziawg_s1) not in amneziawg_existing_config

- name: amneziawg | Check if private key exists
  ansible.builtin.stat:
    path: "{{ amneziawg_config_dir }}/{{ amneziawg_interface }}_privatekey"
  register: privatekey_file

- name: amneziawg | Generate private key
  ansible.builtin.shell: awg genkey
  register: generated_private_key
  when: amneziawg_private_key == "" and not privatekey_file.stat.exists
  no_log: true

- name: amneziawg | Save private key to file
  ansible.builtin.copy:
    content: "{{ generated_private_key.stdout }}"
    dest: "{{ amneziawg_config_dir }}/{{ amneziawg_interface }}_privatekey"
    owner: root
    group: root
    mode: "0600"
  when: amneziawg_private_key == "" and not privatekey_file.stat.exists
  no_log: true

- name: amneziawg | Read existing private key
  ansible.builtin.slurp:
    src: "{{ amneziawg_config_dir }}/{{ amneziawg_interface }}_privatekey"
  register: existing_private_key
  when: privatekey_file.stat.exists
  no_log: true

- name: amneziawg | Set private key fact (generated)
  ansible.builtin.set_fact:
    amneziawg_private_key_actual: "{{ generated_private_key.stdout }}"
  when: amneziawg_private_key == "" and not privatekey_file.stat.exists
  no_log: true

- name: amneziawg | Set private key fact (existing)
  ansible.builtin.set_fact:
    amneziawg_private_key_actual: "{{ existing_private_key.content | b64decode | trim }}"
  when: privatekey_file.stat.exists
  no_log: true

- name: amneziawg | Set private key fact (provided)
  ansible.builtin.set_fact:
    amneziawg_private_key_actual: "{{ amneziawg_private_key }}"
  when: amneziawg_private_key != ""
  no_log: true

- name: amneziawg | Generate public key
  ansible.builtin.shell: echo "{{ amneziawg_private_key_actual }}" | awg pubkey
  register: public_key
  changed_when: false
  no_log: true

- name: amneziawg | Save public key to file
  ansible.builtin.copy:
    content: "{{ public_key.stdout }}"
    dest: "{{ amneziawg_config_dir }}/{{ amneziawg_interface }}_publickey"
    owner: root
    group: root
    mode: "0644"

- name: amneziawg | Display public key
  ansible.builtin.debug:
    msg: "AmneziaWG public key: {{ public_key.stdout }}"

- name: amneziawg | Enable IPv4 forwarding
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    state: present
    reload: true
  when: amneziawg_ip_forward | bool

- name: amneziawg | Enable IPv6 forwarding
  ansible.posix.sysctl:
    name: net.ipv6.conf.all.forwarding
    value: "1"
    state: present
    reload: true
  when: amneziawg_ip_forward | bool and amneziawg_ipv6_forward | bool

- name: amneziawg | Deploy AmneziaWG configuration
  ansible.builtin.template:
    src: awg.conf.j2
    dest: "{{ amneziawg_config_dir }}/{{ amneziawg_interface }}.conf"
    owner: root
    group: root
    mode: "0600"
  notify: Restart AmneziaWG
  when: not amneziawg_peers_exist or amneziawg_force_config

- name: amneziawg | Skip config deployment (peers exist)
  ansible.builtin.debug:
    msg: "Skipping config deployment - {{ amneziawg_peers_count }} peer(s) found. Manage peers via WGDashboard."
  when: amneziawg_peers_exist and not amneziawg_force_config

- name: amneziawg | Enable and start AmneziaWG
  ansible.builtin.systemd:
    name: "awg-quick@{{ amneziawg_interface }}"
    enabled: true
    state: started

- name: amneziawg | Display completion message
  ansible.builtin.debug:
    msg: |
      AmneziaWG installed successfully!

      Interface: {{ amneziawg_interface }}
      Address: {{ amneziawg_address }}
      Port: {{ amneziawg_port }}
      Public Key: {{ public_key.stdout }}

      Obfuscation params:
        Jc={{ amneziawg_jc }}, Jmin={{ amneziawg_jmin }}, Jmax={{ amneziawg_jmax }}
        S1={{ amneziawg_s1 }}, S2={{ amneziawg_s2 }}
        H1={{ amneziawg_h1 }}, H2={{ amneziawg_h2 }}, H3={{ amneziawg_h3 }}, H4={{ amneziawg_h4 }}

      NOTE: iptables/NAT rules are managed by ansible-role-firewall.
      Run firewall role to complete the setup.
