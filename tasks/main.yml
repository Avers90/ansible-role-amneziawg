---
- name: amneziawg | Fail if distro is not supported
  ansible.builtin.fail:
    msg: "Distribution '{{ ansible_facts['distribution'] }}' is not supported. Supported: Debian, Ubuntu"
  when: ansible_facts['distribution'] not in ['Debian', 'Ubuntu']

- name: amneziawg | Validate obfuscation parameters
  ansible.builtin.assert:
    that:
      - "(amneziawg_s1 | int + 56) != (amneziawg_s2 | int)"
      - "amneziawg_jmin | int < amneziawg_jmax | int"
      - "amneziawg_jc | int >= 1 and amneziawg_jc | int <= 128"
      - "amneziawg_jmax | int <= 1280"
      - >-
        [amneziawg_h1, amneziawg_h2, amneziawg_h3, amneziawg_h4]
        | map('string') | map('trim') | unique | length == 4
    fail_msg: >-
      Invalid AmneziaWG obfuscation params
      (require S1+56 != S2, Jmin < Jmax, 1 <= Jc <= 128, Jmax <= 1280, H1-H4 unique).
    quiet: true

# Upper bounds are the amnezia-client conventions (protocolConstants.h), not
# kernel limits — the module only enforces a minimum of 12 when header
# protection is in use. Keeping the client bounds avoids configs the official
# GUI would refuse to import.
- name: amneziawg | Validate junk packet sizes (S1-S4)
  ansible.builtin.assert:
    that:
      - "item.value | int == 0 or item.value | int >= 12"
      - "item.value | int <= item.max"
    fail_msg: >-
      Invalid AmneziaWG {{ item.name }}={{ item.value }} —
      must be 0 (disabled) or between 12 and {{ item.max }}.
    quiet: true
  loop:
    - { name: S1, value: "{{ amneziawg_s1 }}", max: 150 }
    - { name: S2, value: "{{ amneziawg_s2 }}", max: 150 }
    - { name: S3, value: "{{ amneziawg_s3 }}", max: 64 }
    - { name: S4, value: "{{ amneziawg_s4 }}", max: 64 }
  loop_control:
    label: "{{ item.name }}={{ item.value }}"

- name: amneziawg | Validate CPS syntax (I1-I5)
  ansible.builtin.assert:
    that:
      - "lookup('vars', 'amneziawg_i' ~ item) is match(amneziawg_cps_regex)"
    fail_msg: >-
      Invalid CPS syntax in amneziawg_i{{ item }}.
      Allowed tags: <b 0xHEX> (even number of hex digits), <t>,
      <r N>, <rc N>, <rd N> with 1 <= N <= 1000. No separators between tags.
    quiet: true
  loop: "{{ range(1, 6) | list }}"
  loop_control:
    label: "I{{ item }}"
  when: lookup('vars', 'amneziawg_i' ~ item) | length > 0
  vars:
    amneziawg_cps_regex: >-
      ^(?:<b 0x(?:[0-9a-fA-F]{2})+>|<t>|<r[cd]? (?:[1-9][0-9]{0,2}|1000)>)+$

# Mirrors awgVersionOf() in amnezia-client (awgProtocolConfig.cpp) so the role
# labels a config exactly the way the official client would classify it.
- name: amneziawg | Derive effective config version
  ansible.builtin.set_fact:
    amneziawg_version_effective: >-
      {%- if amneziawg_s3 | int > 0 or amneziawg_s4 | int > 0
             or ([amneziawg_h1, amneziawg_h2, amneziawg_h3, amneziawg_h4]
                 | map('string') | join(',')) is search('-') -%}
      2.0
      {%- elif (amneziawg_i1 ~ amneziawg_i2 ~ amneziawg_i3
                ~ amneziawg_i4 ~ amneziawg_i5) | length > 0 -%}
      1.5
      {%- else -%}
      1.0
      {%- endif -%}

- name: amneziawg | Assert declared config version matches the parameters
  ansible.builtin.assert:
    that:
      - "amneziawg_version_effective == amneziawg_config_version"
    fail_msg: >-
      Parameters resolve to AmneziaWG v{{ amneziawg_version_effective }},
      but amneziawg_config_version is "{{ amneziawg_config_version }}".
      Either bump the declared version for this host, or move the
      v1.5/v2.0 parameters out of the shared group_vars into host_vars.
    quiet: true

- name: amneziawg | Install prerequisites
  ansible.builtin.apt:
    name:
      - gnupg2
      - python3-debian                                  # required by deb822_repository
      - "linux-headers-{{ ansible_facts['kernel'] }}"   # current kernel — immediate DKMS build
      - "{{ amneziawg_headers_meta_package }}"          # meta — tracks future kernels
    state: present
    update_cache: true

- name: amneziawg | Ensure apt keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

# Remove any legacy one-line .list from the apt_key / apt_repository /
# add-apt-repository era (e.g. amnezia.list, amnezia-ubuntu-ppa-*.list,
# ppa_amnezia_ppa_<suite>.list) to avoid a duplicate source alongside the new
# deb822 amnezia.sources. A leftover .list has an empty Signed-By and clashes
# with amnezia.sources' Signed-By, breaking `apt update`:
#   "E:Conflicting values set for option Signed-By ... amnezia.asc != ".
# Match by content (the PPA URL) rather than by filename so any naming survives.
- name: amneziawg | Find legacy one-line repo files referencing the Amnezia PPA
  ansible.builtin.shell: >-
    set -o pipefail;
    grep -rlE "ppa\.launchpad(content)?\.net/amnezia"
    /etc/apt/sources.list.d/ 2>/dev/null
    | grep -E '\.list$' || true
  args:
    executable: /bin/bash
  register: amneziawg_legacy_repos
  changed_when: false

- name: amneziawg | Remove legacy one-line repository files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ amneziawg_legacy_repos.stdout_lines }}"
  when: item | length > 0

# deb822_repository replaces the deprecated apt_key / apt_repository modules
# (removed in ansible-core 2.25). The PPA signing key is fetched as an
# ASCII-armored keyring and referenced via signed_by.
# Guarding the download with an explicit stat rather than relying on
# `force: false` alone: in check mode get_url probes the URL even when it would
# not download, and keyserver.ubuntu.com answers 405 to that probe, which fails
# the whole play. Same end state, but `--check` stays usable.
- name: amneziawg | Check whether the PPA signing key is already present
  ansible.builtin.stat:
    path: /etc/apt/keyrings/amnezia.asc
  register: amneziawg_ppa_key_file

- name: amneziawg | Download AmneziaWG PPA signing key
  ansible.builtin.get_url:
    url: "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x{{ amneziawg_ppa_key_id }}&options=mr"
    dest: /etc/apt/keyrings/amnezia.asc
    owner: root
    group: root
    mode: "0644"
    # keyserver.ubuntu.com is frequently overloaded — do not re-download when the
    # key already exists, and retry on transient timeouts instead of failing.
    force: false
    timeout: "{{ amneziawg_ppa_key_timeout }}"
  register: amneziawg_ppa_key_result
  until: amneziawg_ppa_key_result is succeeded
  retries: "{{ amneziawg_ppa_key_retries }}"
  delay: "{{ amneziawg_ppa_key_delay }}"
  when: not amneziawg_ppa_key_file.stat.exists

- name: amneziawg | Add AmneziaWG PPA repository
  ansible.builtin.deb822_repository:
    name: amnezia
    types: "{{ ['deb', 'deb-src'] if ansible_facts['distribution'] == 'Debian' else ['deb'] }}"
    uris: "https://ppa.launchpadcontent.net/amnezia/ppa/ubuntu"
    # Suite resolution (incl. Debian->focal and unsupported-release remap) via amneziawg_ppa_suite.
    suites: "{{ amneziawg_ppa_suite }}"
    components:
      - main
    signed_by: /etc/apt/keyrings/amnezia.asc
    enabled: true
    state: present

- name: amneziawg | Install AmneziaWG packages
  ansible.builtin.apt:
    name:
      - amneziawg          # metapackage (pulls tools + any future deps)
      # dkms must be listed explicitly: the metapackage depends on
      # "amneziawg-dkms (>= 0.0.20200121-2) | amneziawg-modules", a loose >= pin
      # that stays satisfied by an old dkms, so upgrading the metapackage alone
      # never forces a new kernel module. Listing it here makes state=latest apply.
      - amneziawg-dkms     # explicit: force kernel module to latest
      - amneziawg-tools    # explicit: force userland tools to latest
    state: "{{ 'latest' if amneziawg_update | bool else 'present' }}"
    # Required: refresh cache so the newly added Amnezia repo is visible.
    update_cache: true

- name: amneziawg | Ensure config directory exists
  ansible.builtin.file:
    path: "{{ amneziawg_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: amneziawg | Check if AmneziaWG config exists
  ansible.builtin.stat:
    path: "{{ amneziawg_config_dir }}/{{ amneziawg_interface }}.conf"
  register: awg_config_file

- name: amneziawg | Read existing config (if present)
  ansible.builtin.slurp:
    src: "{{ amneziawg_config_dir }}/{{ amneziawg_interface }}.conf"
  register: awg_config_content
  when: awg_config_file.stat.exists
  no_log: true

- name: amneziawg | Store decoded config content
  ansible.builtin.set_fact:
    amneziawg_existing_config: "{{ (awg_config_content.content | b64decode) if awg_config_file.stat.exists else '' }}"
  no_log: true

- name: amneziawg | Set peer count and existence facts
  ansible.builtin.set_fact:
    amneziawg_peers_count: "{{ amneziawg_existing_config.split('[Peer]') | length - 1 }}"
    amneziawg_peers_exist: "{{ (amneziawg_existing_config.split('[Peer]') | length - 1) > 0 }}"

- name: amneziawg | Display peers status
  ansible.builtin.debug:
    msg: "AmneziaWG config has {{ amneziawg_peers_count }} peer(s). Config will {{ 'NOT be modified' if (amneziawg_peers_exist and not amneziawg_force_config) else 'be deployed' }}."

# S3/S4/I1-I5 are only compared when enabled: `awg-quick save` rewrites the
# config via `awg showconf`, which emits "S3 = 0" even on a v1.0 host, while the
# role's template omits the line entirely. Comparing them unconditionally would
# report drift on every legacy host.
- name: amneziawg | Detect [Interface] parameter drift
  ansible.builtin.set_fact:
    amneziawg_config_drift: >-
      {{ (['ListenPort = ' ~ amneziawg_port,
            'Jc = ' ~ amneziawg_jc,
            'S1 = ' ~ amneziawg_s1,
            'S2 = ' ~ amneziawg_s2,
            'H1 = ' ~ amneziawg_h1]
          + (['S3 = ' ~ amneziawg_s3] if amneziawg_s3 | int > 0 else [])
          + (['S4 = ' ~ amneziawg_s4] if amneziawg_s4 | int > 0 else [])
          + (['I1 = ' ~ amneziawg_i1] if amneziawg_i1 | length > 0 else []))
         | reject('in', amneziawg_existing_config) | list }}

- name: amneziawg | Warn if interface params drift but peers exist
  ansible.builtin.debug:
    msg: >-
      WARNING: [Interface] params differ from the deployed config, but
      {{ amneziawg_peers_count }} peer(s) exist — changes were NOT applied.
      Drifted: {{ amneziawg_config_drift | join('; ') }}.
      To apply: set amneziawg_force_config=true (WARNING: wipes peers) or edit
      {{ amneziawg_config_dir }}/{{ amneziawg_interface }}.conf manually.
  when:
    - amneziawg_peers_exist
    - not amneziawg_force_config
    - amneziawg_config_drift | length > 0

- name: amneziawg | Check if private key exists
  ansible.builtin.stat:
    path: "{{ amneziawg_config_dir }}/{{ amneziawg_interface }}_privatekey"
  register: privatekey_file

- name: amneziawg | Generate private key
  ansible.builtin.shell: awg genkey
  register: generated_private_key
  when: amneziawg_private_key == "" and not privatekey_file.stat.exists
  no_log: true

- name: amneziawg | Save private key to file
  ansible.builtin.copy:
    content: "{{ generated_private_key.stdout }}"
    dest: "{{ amneziawg_config_dir }}/{{ amneziawg_interface }}_privatekey"
    owner: root
    group: root
    mode: "0600"
  when: amneziawg_private_key == "" and not privatekey_file.stat.exists
  no_log: true

- name: amneziawg | Read existing private key
  ansible.builtin.slurp:
    src: "{{ amneziawg_config_dir }}/{{ amneziawg_interface }}_privatekey"
  register: existing_private_key
  when: privatekey_file.stat.exists
  no_log: true

- name: amneziawg | Set private key fact (generated)
  ansible.builtin.set_fact:
    amneziawg_private_key_actual: "{{ generated_private_key.stdout }}"
  when: amneziawg_private_key == "" and not privatekey_file.stat.exists
  no_log: true

- name: amneziawg | Set private key fact (existing)
  ansible.builtin.set_fact:
    amneziawg_private_key_actual: "{{ existing_private_key.content | b64decode | trim }}"
  when: privatekey_file.stat.exists
  no_log: true

- name: amneziawg | Set private key fact (provided)
  ansible.builtin.set_fact:
    amneziawg_private_key_actual: "{{ amneziawg_private_key }}"
  when: amneziawg_private_key != ""
  no_log: true

# check_mode: false — deriving the public key is a read-only operation, and
# without it `shell` is skipped under --check, leaving public_key.stdout empty.
# The next task would then report a diff that wipes the public key file, which
# is both alarming and wrong.
- name: amneziawg | Generate public key
  ansible.builtin.shell: echo "{{ amneziawg_private_key_actual }}" | awg pubkey
  register: public_key
  changed_when: false
  check_mode: false
  no_log: true

- name: amneziawg | Save public key to file
  ansible.builtin.copy:
    content: "{{ public_key.stdout }}"
    dest: "{{ amneziawg_config_dir }}/{{ amneziawg_interface }}_publickey"
    owner: root
    group: root
    mode: "0644"

- name: amneziawg | Display public key
  ansible.builtin.debug:
    msg: "AmneziaWG public key: {{ public_key.stdout }}"

- name: amneziawg | Enable IPv4 forwarding
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    state: present
    reload: true
  when: amneziawg_ip_forward | bool

- name: amneziawg | Enable IPv6 forwarding
  ansible.posix.sysctl:
    name: net.ipv6.conf.all.forwarding
    value: "1"
    state: present
    reload: true
  when: amneziawg_ip_forward | bool and amneziawg_ipv6_forward | bool

- name: amneziawg | Deploy AmneziaWG configuration
  ansible.builtin.template:
    src: awg.conf.j2
    dest: "{{ amneziawg_config_dir }}/{{ amneziawg_interface }}.conf"
    owner: root
    group: root
    mode: "0600"
  notify: Restart AmneziaWG
  when: not amneziawg_peers_exist or amneziawg_force_config

- name: amneziawg | Skip config deployment (peers exist)
  ansible.builtin.debug:
    msg: "Skipping config deployment - {{ amneziawg_peers_count }} peer(s) found. Manage peers via WGDashboard."
  when: amneziawg_peers_exist and not amneziawg_force_config

- name: amneziawg | Enable and start AmneziaWG
  ansible.builtin.systemd:
    name: "awg-quick@{{ amneziawg_interface }}"
    enabled: true
    state: started

- name: amneziawg | Display completion message
  ansible.builtin.debug:
    msg: |
      AmneziaWG installed successfully!

      Interface: {{ amneziawg_interface }}
      Address: {{ amneziawg_address }}
      Port: {{ amneziawg_port }}
      Public Key: {{ public_key.stdout }}

      Config version: {{ amneziawg_version_effective }}

      Obfuscation params:
        Jc={{ amneziawg_jc }}, Jmin={{ amneziawg_jmin }}, Jmax={{ amneziawg_jmax }}
        S1={{ amneziawg_s1 }}, S2={{ amneziawg_s2 }}, S3={{ amneziawg_s3 }}, S4={{ amneziawg_s4 }}
        H1={{ amneziawg_h1 }}, H2={{ amneziawg_h2 }}, H3={{ amneziawg_h3 }}, H4={{ amneziawg_h4 }}
      {% for n in range(1, 6) if lookup('vars', 'amneziawg_i' ~ n) | length > 0 %}
        I{{ n }}={{ lookup('vars', 'amneziawg_i' ~ n) }}
      {% endfor %}
      {% if amneziawg_s4 | int > 0 %}

      MTU: S4={{ amneziawg_s4 }} is NOT accounted for in the interface MTU
      (the kernel always sets {{ amneziawg_iface_mtu }}), so the client MTU must be
      <= {{ amneziawg_iface_mtu | int - (amneziawg_s4 | int) }}. 1376 is the Amnezia reference value and also
      survives PPPoE (1492) paths. With WGDashboard set wgdashboard_peer_mtu —
      it applies to NEWLY created peers only, existing ones keep the MTU stored
      in the WGDashboard database.
      Verify end to end from a client: ping -s <MTU-28> -M do 8.8.8.8
      {% endif %}

      NOTE: iptables/NAT rules are managed by ansible-role-firewall.
      Run firewall role to complete the setup.
